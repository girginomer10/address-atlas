name: address-atlas-sync

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ADDRESS_ATLAS_DOMAIN: "${ADDRESS_ATLAS_DOMAIN:?ADDRESS_ATLAS_DOMAIN is required}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../..
      dockerfile: server/sync/Dockerfile
    restart: unless-stopped
    environment:
      ADDRESS_ATLAS_DOMAIN: "${ADDRESS_ATLAS_DOMAIN:?ADDRESS_ATLAS_DOMAIN is required}"
      ADDRESS_ATLAS_SYNC_ONLY: "true"
      NODE_ENV: "production"
      SYNC_DATABASE_URL: "${SYNC_DATABASE_URL:?SYNC_DATABASE_URL is required}"
      SYNC_SESSION_SECRET: "${SYNC_SESSION_SECRET:?SYNC_SESSION_SECRET is required}"
      SYNC_MAX_ACCOUNTS: "${SYNC_MAX_ACCOUNTS:-100000}"
      SYNC_VAULT_DAILY_WRITE_LIMIT: "${SYNC_VAULT_DAILY_WRITE_LIMIT:-100}"
      SYNC_VAULT_DAILY_BYTE_LIMIT: "${SYNC_VAULT_DAILY_BYTE_LIMIT:-64000000}"
      SYNC_GLOBAL_VAULT_STORAGE_LIMIT: "${SYNC_GLOBAL_VAULT_STORAGE_LIMIT:-10000000000}"
      SYNC_DB_POOL_SIZE: "${SYNC_DB_POOL_SIZE:-10}"
      SYNC_DB_CONNECT_TIMEOUT_MS: "${SYNC_DB_CONNECT_TIMEOUT_MS:-5000}"
      SYNC_DB_IDLE_TIMEOUT_MS: "${SYNC_DB_IDLE_TIMEOUT_MS:-30000}"
      SYNC_DB_STATEMENT_TIMEOUT_MS: "${SYNC_DB_STATEMENT_TIMEOUT_MS:-10000}"
      SYNC_DB_QUERY_TIMEOUT_MS: "${SYNC_DB_QUERY_TIMEOUT_MS:-12000}"
      PASSKEY_RP_ID: "${PASSKEY_RP_ID:?PASSKEY_RP_ID is required}"
      PASSKEY_RP_NAME: "${PASSKEY_RP_NAME:?PASSKEY_RP_NAME is required}"
      # Derive the WebAuthn origin from the same host Caddy publishes. The app
      # also validates this invariant before reporting healthy.
      PASSKEY_ORIGIN: "https://${ADDRESS_ATLAS_DOMAIN:?ADDRESS_ATLAS_DOMAIN is required}"
      NATIVE_ENDPOINT_CONFIG_VERSION: "${NATIVE_ENDPOINT_CONFIG_VERSION:-5}"
      NATIVE_ENDPOINT_CONFIG_UPDATED_AT: "${NATIVE_ENDPOINT_CONFIG_UPDATED_AT:-2026-07-14T00:00:00.000Z}"
      NATIVE_ENDPOINT_CONFIG_MESSAGE: "${NATIVE_ENDPOINT_CONFIG_MESSAGE:-}"
      NATIVE_ENDPOINT_MIN_APP_VERSION: "${NATIVE_ENDPOINT_MIN_APP_VERSION:-0.2.0}"
      NATIVE_ENDPOINT_CONFIG_JSON: "${NATIVE_ENDPOINT_CONFIG_JSON:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/healthz | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: address_atlas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: address_atlas_sync
    volumes:
      - address-atlas-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U address_atlas -d address_atlas_sync"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  address-atlas-prod-postgres:
    # An explicit global name prevents future Compose project-name changes from
    # silently attaching a fresh database. manage-prod.sh safely discovers and
    # reuses either historical project-scoped name during upgrades.
    name: "${ADDRESS_ATLAS_POSTGRES_VOLUME:-address-atlas-prod-postgres}"
  caddy-data:
    name: "${ADDRESS_ATLAS_CADDY_DATA_VOLUME:-address-atlas-caddy-data}"
  caddy-config:
    name: "${ADDRESS_ATLAS_CADDY_CONFIG_VOLUME:-address-atlas-caddy-config}"
