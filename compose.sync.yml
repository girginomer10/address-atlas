services:
  sync-postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: address-atlas-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: address_atlas
      POSTGRES_PASSWORD: address_atlas
      POSTGRES_DB: address_atlas_sync
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - address-atlas-sync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "grep -qx postgres /proc/1/comm && pg_isready -h 127.0.0.1 -U address_atlas -d address_atlas_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  address-atlas-sync-postgres:
