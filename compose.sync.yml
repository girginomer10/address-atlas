services:
  sync-postgres:
    image: postgres:16-alpine
    container_name: address-atlas-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: address_atlas
      POSTGRES_PASSWORD: address_atlas
      POSTGRES_DB: address_atlas_sync
    ports:
      - "15432:5432"
    volumes:
      - address-atlas-sync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U address_atlas -d address_atlas_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  address-atlas-sync-postgres:
