name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: release-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate-tests:
    name: Test the release candidate without protected secrets
    if: github.event.deleted == false
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_EVENT_SHA: ${{ github.event.after }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      NATIVE_DIR: native/AddressAtlasMac
    steps:
      - name: Check out the event commit without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the tested checkout to the tag-push event
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$RELEASE_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$tag_ref"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          test "$RELEASE_EVENT_SHA" = "$tag_commit"
          test "$RELEASE_WORKFLOW_SHA" = "$tag_commit"

      - name: Verify the pinned Apple toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          test "$xcode_version" = "26.5"
          xcrun --find notarytool >/dev/null
          xcrun --find stapler >/dev/null

      - name: Run native release tests
        shell: bash
        working-directory: native/AddressAtlasMac
        run: |
          set -Eeuo pipefail
          bash Tests/build-mac-app-version-tests.sh
          bash Tests/notarize-mac-app-tests.sh
          swift test
          swift test --sanitize=thread

  macos-release:
    name: Sign, notarize, and publish on a fresh runner
    needs: release-candidate-tests
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_EVENT_SHA: ${{ github.event.after }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PRODUCTION_SYNC_ORIGIN: ${{ vars.ADDRESS_ATLAS_PRODUCTION_ORIGIN }}
      NATIVE_DIR: native/AddressAtlasMac
    steps:
      - name: Check out the exact release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # A tag name can move while an environment approval is pending. Build
          # the immutable commit recorded by the push event, then prove below
          # that the remote tag still peels to this exact SHA.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js runtime for release policy checks
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Validate source, CI, protected environment, and release immutability
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -Eeuo pipefail

          : "${RELEASE_ADMIN_TOKEN:?Missing release-environment Administration-read token.}"
          for command in git gh jq; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "Required release command is missing: $command" >&2
              exit 1
            }
          done
          # Publication is irreversible. Prove the runner can perform GitHub's
          # release-scoped attestation checks before any draft is created.
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null

          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Releases may run only from a tag push event." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The tag-push event SHA is malformed." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The workflow source SHA is malformed." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match canonical v<major>.<minor>.<patch>." >&2
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_REF" != "$tag_ref" ]]; then
            echo "The event ref and release tag disagree." >&2
            exit 1
          fi
          git show-ref --verify --quiet "$tag_ref" || {
            echo "The requested release tag does not exist in this checkout." >&2
            exit 1
          }

          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"

          remote_tag_records="$(git ls-remote origin "$tag_ref" "${tag_ref}^{}")"
          remote_object_count="$(awk -v ref="$tag_ref" '$2 == ref { count += 1 } END { print count + 0 }' <<< "$remote_tag_records")"
          remote_peeled_count="$(awk -v ref="${tag_ref}^{}" '$2 == ref { count += 1 } END { print count + 0 }' <<< "$remote_tag_records")"
          if [[ "$remote_object_count" != "1" ]] || (( remote_peeled_count > 1 )); then
            echo "The requested tag is missing or ambiguous on origin." >&2
            exit 1
          fi
          remote_tag_object="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<< "$remote_tag_records")"
          remote_tag_commit="$(awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }' <<< "$remote_tag_records")"
          [[ -n "$remote_tag_commit" ]] || remote_tag_commit="$remote_tag_object"
          local_tag_object="$(git rev-parse "$tag_ref")"
          if [[ "$remote_tag_object" != "$local_tag_object" ]]; then
            echo "The checked-out tag does not exactly match the immutable origin tag object." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ||
                "$remote_tag_commit" != "$tag_commit" ||
                "$RELEASE_EVENT_SHA" != "$tag_commit" ||
                "$RELEASE_WORKFLOW_SHA" != "$tag_commit" ]]; then
            echo "HEAD, workflow source, pushed event SHA, and the current peeled remote tag do not identify one commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "The tagged commit is not contained in origin/main." >&2
            exit 1
          fi

          build_script="$NATIVE_DIR/build-mac-app.sh"
          expected_version_binding='APP_VERSION_SOURCE="$ROOT/Sources/AddressAtlasMac/AppState.swift"'
          if ! grep -Fxq "$expected_version_binding" "$build_script"; then
            echo "The release workflow and app builder disagree on the version metadata source." >&2
            exit 1
          fi
          version_source="$NATIVE_DIR/Sources/AddressAtlasMac/AppState.swift"
          version_pattern='s/^[[:space:]]*static let currentAppVersion = "((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))"$/\1/p'
          version_count="$(sed -nE "$version_pattern" "$version_source" | wc -l | tr -d '[:space:]')"
          if [[ "$version_count" != "1" ]]; then
            echo "Expected exactly one valid currentAppVersion in build metadata." >&2
            exit 1
          fi
          app_version="$(sed -nE "$version_pattern" "$version_source")"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Tag $RELEASE_TAG does not match the app version v$app_version." >&2
            exit 1
          fi
          config_source="$NATIVE_DIR/Sources/AddressAtlasCore/Sync/NativeEndpointConfig.swift"
          bundled_config_version="$(sed -nE \
            '/public static let bundled = NativeEndpointConfig\(/,/^[[:space:]]*chains:/ s/^[[:space:]]*configVersion: ([1-9][0-9]*),$/\1/p' \
            "$config_source")"
          if [[ ! "$bundled_config_version" =~ ^[1-9][0-9]*$ ]] \
            || (( bundled_config_version > 2000000000 )) \
            || [[ "$(printf '%s\n' "$bundled_config_version" | wc -l | tr -d '[:space:]')" != "1" ]]; then
            echo "Expected exactly one bounded bundled native config version." >&2
            exit 1
          fi
          security_policy=".github/SECURITY.md"
          expected_private_reporting_link="<https://github.com/$GITHUB_REPOSITORY/security/advisories/new>"
          if [[ ! -f "$security_policy" || -L "$security_policy" ]] \
            || ! grep -Fxq "$expected_private_reporting_link" "$security_policy"; then
            echo "SECURITY.md must point to this repository's private vulnerability-reporting flow." >&2
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet || \
             [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Release checkout is not clean." >&2
            exit 1
          fi

          api_dir="$(mktemp -d "$RUNNER_TEMP/address-atlas-release-preflight.XXXXXX")"
          trap 'rm -rf "$api_dir"' EXIT
          api_header=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2026-03-10'
          )

          # The environment gate is part of the security boundary, not merely a
          # label. Require a different reviewer, prevent self-approval, and allow
          # only v* tags. A missing or broadly configured environment fails shut.
          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
            "repos/$GITHUB_REPOSITORY/environments/release" \
            > "$api_dir/environment.json"
          jq -e '
            .name == "release"
            and .deployment_branch_policy.protected_branches == false
            and .deployment_branch_policy.custom_branch_policies == true
            and any(
              .protection_rules[]?;
              .type == "required_reviewers"
              and .prevent_self_review == true
              and (.reviewers | type == "array" and length > 0)
            )
          ' "$api_dir/environment.json" >/dev/null || {
            echo "The release environment lacks the required reviewer/self-review/tag-policy protections." >&2
            exit 1
          }
          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies?per_page=100" \
            > "$api_dir/environment-policies.json"
          jq -e '
            [.[].branch_policies[]?] as $policies
            | ($policies | length) == 1
              and $policies[0].type == "tag"
              and $policies[0].name == "v*"
          ' "$api_dir/environment-policies.json" >/dev/null || {
            echo "The release environment must allow exactly the v* tag policy and no branch policy." >&2
            exit 1
          }

          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$api_dir/immutability.json"
          jq -e '.enabled == true' "$api_dir/immutability.json" >/dev/null || {
            echo "GitHub release immutability is not enabled or could not be proven." >&2
            exit 1
          }

          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
            "repos/$GITHUB_REPOSITORY/private-vulnerability-reporting" \
            > "$api_dir/private-vulnerability-reporting.json"
          jq -e '.enabled == true' "$api_dir/private-vulnerability-reporting.json" >/dev/null || {
            echo "Private vulnerability reporting is disabled even though SECURITY.md directs reporters to it." >&2
            exit 1
          }

          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
            "repos/$GITHUB_REPOSITORY/actions/permissions" \
            > "$api_dir/actions-permissions.json"
          jq -e '
            .enabled == true
            and .allowed_actions == "selected"
            and .sha_pinning_required == true
          ' "$api_dir/actions-permissions.json" >/dev/null || {
            echo "Repository Actions policy must allow only selected actions and require full commit-SHA pinning." >&2
            exit 1
          }
          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
            "repos/$GITHUB_REPOSITORY/actions/permissions/selected-actions" \
            > "$api_dir/selected-actions.json"
          jq -e '
            .github_owned_allowed == true
            and .verified_allowed == false
            and (.patterns_allowed | type == "array" and length == 0)
          ' "$api_dir/selected-actions.json" >/dev/null || {
            echo "Selected Actions policy must allow only GitHub-owned actions; broad verified or pattern grants are forbidden." >&2
            exit 1
          }
          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
            "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
            > "$api_dir/workflow-permissions.json"
          jq -e '
            .default_workflow_permissions == "read"
            and .can_approve_pull_request_reviews == false
          ' "$api_dir/workflow-permissions.json" >/dev/null || {
            echo "Default Actions tokens must be read-only and forbidden from approving pull requests." >&2
            exit 1
          }

          # Resolve every ruleset in full; the list endpoint omits rule details.
          # Require one complete active main policy and one complete active v* tag
          # policy rather than inferring protection from a name or partial rules.
          # GitHub withholds bypass_actors from read-only tokens, so that list is
          # deliberately kept as a separate manual governance audit instead of
          # granting this release token Administration-write access.
          GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&per_page=100" \
            > "$api_dir/ruleset-list.json"
          : > "$api_dir/rulesets.ndjson"
          while IFS= read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "GitHub returned a malformed repository ruleset ID." >&2
              exit 1
            }
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" \
              >> "$api_dir/rulesets.ndjson"
            printf '\n' >> "$api_dir/rulesets.ndjson"
          done < <(jq -r '.[][]? | .id' "$api_dir/ruleset-list.json")
          jq -s '.' "$api_dir/rulesets.ndjson" > "$api_dir/rulesets.json"
          jq -e '
            def explicit_ref($target; $include):
              .target == $target
              and .enforcement == "active"
              and (.conditions.ref_name.include | type == "array")
              and (.conditions.ref_name.exclude | type == "array" and length == 0)
              and (.conditions.ref_name.include | index($include)) != null;
            def has_rule($type):
              any(.rules[]?; .type == $type);
            def strong_main($required_checks):
              (explicit_ref("branch"; "~DEFAULT_BRANCH") or explicit_ref("branch"; "refs/heads/main"))
              and has_rule("deletion")
              and has_rule("non_fast_forward")
              and has_rule("required_linear_history")
              and any(
                .rules[]?;
                .type == "pull_request"
                and .parameters.dismiss_stale_reviews_on_push == true
                and .parameters.require_last_push_approval == true
                and .parameters.required_review_thread_resolution == true
                and .parameters.required_approving_review_count >= 1
              )
              and any(
                .rules[]?;
                .type == "required_status_checks"
                and .parameters.strict_required_status_checks_policy == true
                and .parameters.do_not_enforce_on_create != true
                and (
                  [
                    .parameters.required_status_checks[]?
                    | select(.integration_id | type == "number" and . > 0)
                    | .context
                  ] as $configured
                  | all(
                      $required_checks[];
                      . as $required
                      | ($configured | index($required)) != null
                    )
                )
              );
            def strong_release_tags:
              explicit_ref("tag"; "refs/tags/v*")
              and has_rule("creation")
              and has_rule("update")
              and has_rule("deletion");
            [
              "Repository secret-artifact hygiene",
              "Web and sync server",
              "Native macOS package",
              "Deployment configuration"
            ] as $required_checks
            | any(.[]; strong_main($required_checks))
              and any(.[]; strong_release_tags)
          ' "$api_dir/rulesets.json" >/dev/null || {
            echo "Active main and v* rulesets do not meet the release governance contract." >&2
            exit 1
          }

          # A release may be drafted but not returned by the tag endpoint. List
          # every authenticated release page so any existing draft or published
          # release makes this create-once workflow stop before it builds.
          gh api "${api_header[@]}" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$api_dir/releases.json"
          jq -e --arg tag "$RELEASE_TAG" \
            '[.[][]? | select(.tag_name == $tag)] | length == 0' \
            "$api_dir/releases.json" >/dev/null || {
            echo "A draft or published GitHub Release already exists for $RELEASE_TAG; refusing to mutate it." >&2
            exit 1
          }

          # Publication is allowed only after the complete CI workflow has
          # already passed for the exact commit carried by this tag.
          gh api "${api_header[@]}" --method GET \
            -f "head_sha=$tag_commit" \
            -f event=push \
            -F per_page=100 \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            > "$api_dir/ci-runs.json"
          jq -e --arg sha "$tag_commit" '
            any(
              .workflow_runs[]?;
              .head_sha == $sha
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
            )
          ' "$api_dir/ci-runs.json" >/dev/null || {
            echo "The exact tagged commit has no successful completed CI push run." >&2
            exit 1
          }

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "bundled_config_version=$bundled_config_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Bind the client release to the live production config
        id: production-config
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          BUNDLED_CONFIG_VERSION: ${{ steps.release.outputs.bundled_config_version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          binding="$(scripts/verify-live-native-config.sh \
            "$PRODUCTION_SYNC_ORIGIN" \
            "$APP_VERSION" \
            "$BUNDLED_CONFIG_VERSION" \
            "$SOURCE_COMMIT" \
            "${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-prebuild")"
          echo "binding=$binding" >> "$GITHUB_OUTPUT"

      - name: Verify the pinned Apple toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          test "$xcode_version" = "26.5"
          xcrun --find notarytool >/dev/null
          xcrun --find stapler >/dev/null

      - name: Import signing credentials, build, and notarize
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          EXPECTED_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          umask 077

          : "${DEVELOPER_ID_P12_BASE64:?Missing release-environment P12 secret.}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing release-environment P12 password.}"
          : "${NOTARY_KEY_P8_BASE64:?Missing release-environment notary key secret.}"
          : "${NOTARY_KEY_ID:?Missing release-environment notary key ID.}"
          : "${NOTARY_ISSUER_ID:?Missing release-environment notary issuer ID.}"
          : "${EXPECTED_DEVELOPER_TEAM_ID:?Missing release-environment Developer Team ID.}"

          if [[ ! "$NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "The App Store Connect API key ID has an invalid shape." >&2
            exit 1
          fi
          if [[ ! "$NOTARY_ISSUER_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "The App Store Connect issuer ID has an invalid shape." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_DEVELOPER_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "The expected Apple Developer Team ID has an invalid shape." >&2
            exit 1
          fi

          secrets_dir="$(mktemp -d "$RUNNER_TEMP/address-atlas-release-secrets.XXXXXX")"
          signing_keychain="$RUNNER_TEMP/address-atlas-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db"
          p12_path="$secrets_dir/developer-id.p12"
          notary_key_path="$secrets_dir/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="$(printf '%s\n' "$existing_keychain" | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            [[ -n "$existing_keychain" ]] && original_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user)

          cleanup() {
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
            rm -rf "$secrets_dir"
          }
          trap cleanup EXIT

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$p12_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$notary_key_path"
          chmod 600 "$p12_path" "$notary_key_path"
          openssl pkey -in "$notary_key_path" -noout >/dev/null

          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$p12_path" \
            -k "$signing_keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain" "${original_keychains[@]}"
          unset DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64

          identity_records="$(security find-identity -v -p codesigning "$signing_keychain" \
            | grep '"Developer ID Application:' || true)"
          identity_count="$(printf '%s\n' "$identity_records" | awk 'NF { count += 1 } END { print count + 0 }')"
          if [[ "$identity_count" != "1" ]]; then
            echo "The P12 must contain exactly one usable Developer ID Application identity." >&2
            exit 1
          fi
          signing_identity="$(printf '%s\n' "$identity_records" \
            | sed -nE 's/^[[:space:]]*[0-9]+\) ([[:xdigit:]]{40}) .*/\1/p')"
          if [[ ! "$signing_identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "Could not resolve the imported Developer ID Application identity." >&2
            exit 1
          fi
          signing_team_id="$(printf '%s\n' "$identity_records" \
            | sed -nE 's/.*"Developer ID Application:.* \(([A-Z0-9]{10})\)"[[:space:]]*$/\1/p')"
          if [[ "$signing_team_id" != "$EXPECTED_DEVELOPER_TEAM_ID" ]]; then
            echo "The imported Developer ID identity belongs to an unexpected Apple team." >&2
            exit 1
          fi

          export ADDRESS_ATLAS_CODESIGN_IDENTITY="$signing_identity"
          export ADDRESS_ATLAS_NOTARY_KEY_PATH="$notary_key_path"
          export ADDRESS_ATLAS_NOTARY_KEY_ID="$NOTARY_KEY_ID"
          export ADDRESS_ATLAS_NOTARY_ISSUER_ID="$NOTARY_ISSUER_ID"
          "$NATIVE_DIR/notarize-mac-app.sh"

      - name: Verify the signed and notarized artifacts
        shell: bash
        env:
          EXPECTED_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          : "${EXPECTED_DEVELOPER_TEAM_ID:?Missing release-environment Developer Team ID.}"
          app_path="$NATIVE_DIR/dist/Address Atlas.app"
          dmg_path="$NATIVE_DIR/dist/Address Atlas.dmg"
          test -d "$app_path"
          test -f "$dmg_path"

          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign --verify --strict --verbose=4 "$dmg_path"
          codesign_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          grep -q '^Authority=Developer ID Application:' <<< "$codesign_details"
          grep -Fxq "TeamIdentifier=$EXPECTED_DEVELOPER_TEAM_ID" <<< "$codesign_details"
          grep -q 'flags=.*runtime' <<< "$codesign_details"

          plutil -lint "$app_path/Contents/Info.plist"
          bundle_identifier="$(plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist")"
          test "$bundle_identifier" = "com.addressatlas.mac"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")"
          test "$bundle_version" = "${{ steps.release.outputs.app_version }}"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/Address Atlas")"
          architecture_count="$(wc -w <<< "$architectures" | tr -d '[:space:]')"
          test "$architecture_count" = "2"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]

          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/address-atlas-dmg.XXXXXX")"
          mounted=false
          cleanup_mount() {
            if [[ "$mounted" == "true" ]]; then
              hdiutil detach "$mount_dir" -quiet || true
            fi
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -readonly -nobrowse -noautoopen \
            -mountpoint "$mount_dir" "$dmg_path" >/dev/null
          mounted=true
          installed_app="$mount_dir/Address Atlas.app"
          test -d "$installed_app"
          codesign --verify --deep --strict --verbose=4 "$installed_app"
          spctl --assess --type execute --verbose=4 "$installed_app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          hdiutil detach "$mount_dir" -quiet
          mounted=false

      - name: Build checksums and release manifest
        id: artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v jq >/dev/null 2>&1
          app_path="$NATIVE_DIR/dist/Address Atlas.app"
          dmg_path="$NATIVE_DIR/dist/Address Atlas.dmg"
          release_dir="$RUNNER_TEMP/address-atlas-release"
          rm -rf "$release_dir"
          mkdir -m 700 "$release_dir"

          artifact_name="Address-Atlas-$RELEASE_TAG.dmg"
          manifest_name="Address-Atlas-$RELEASE_TAG-manifest.json"
          checksums_name="Address-Atlas-$RELEASE_TAG-SHA256SUMS.txt"
          cp "$dmg_path" "$release_dir/$artifact_name"

          artifact_sha256="$(shasum -a 256 "$release_dir/$artifact_name" | awk '{ print $1 }')"
          artifact_bytes="$(stat -f '%z' "$release_dir/$artifact_name")"
          build_version="$(plutil -extract CFBundleVersion raw "$app_path/Contents/Info.plist")"
          minimum_macos="$(plutil -extract LSMinimumSystemVersion raw "$app_path/Contents/Info.plist")"
          generated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "${{ steps.release.outputs.app_version }}" \
            --arg build "$build_version" \
            --arg source_commit "${{ steps.release.outputs.source_commit }}" \
            --arg minimum_macos "$minimum_macos" \
            --arg artifact_name "$artifact_name" \
            --arg artifact_sha256 "$artifact_sha256" \
            --arg generated_at "$generated_at" \
            --argjson artifact_bytes "$artifact_bytes" '
              {
                schemaVersion: 1,
                product: "Address Atlas",
                tag: $tag,
                version: $version,
                build: $build,
                sourceCommit: $source_commit,
                minimumMacOS: $minimum_macos,
                artifact: {
                  name: $artifact_name,
                  bytes: $artifact_bytes,
                  sha256: $artifact_sha256
                },
                generatedAt: $generated_at
              }
            ' > "$release_dir/$manifest_name"
          plutil -lint "$release_dir/$manifest_name"

          (
            cd "$release_dir"
            shasum -a 256 "$artifact_name" "$manifest_name" > "$checksums_name"
            shasum -a 256 --check "$checksums_name"
          )

          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "manifest_name=$manifest_name" >> "$GITHUB_OUTPUT"
          echo "checksums_name=$checksums_name" >> "$GITHUB_OUTPUT"

      - name: Stage, verify, and publish a create-once GitHub Release
        id: publish
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.artifacts.outputs.release_dir }}
          ARTIFACT_NAME: ${{ steps.artifacts.outputs.artifact_name }}
          MANIFEST_NAME: ${{ steps.artifacts.outputs.manifest_name }}
          CHECKSUMS_NAME: ${{ steps.artifacts.outputs.checksums_name }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          BUNDLED_CONFIG_VERSION: ${{ steps.release.outputs.bundled_config_version }}
          EXPECTED_PRODUCTION_CONFIG_BINDING: ${{ steps.production-config.outputs.binding }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${RELEASE_ADMIN_TOKEN:?Missing release-environment Administration-read token.}"
          for command in curl gh jq openssl shasum; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "Required publication command is missing: $command" >&2
              exit 1
            }
          done
          gh release verify --help >/dev/null 2>&1 || {
            echo "The runner GitHub CLI cannot verify immutable release attestations." >&2
            exit 1
          }
          gh release verify-asset --help >/dev/null 2>&1 || {
            echo "The runner GitHub CLI cannot verify immutable release asset attestations." >&2
            exit 1
          }
          jq -en 'all([true][]; .) and any([true][]; .)' >/dev/null || {
            echo "The runner jq does not support the required validation filters." >&2
            exit 1
          }
          for asset in "$ARTIFACT_NAME" "$MANIFEST_NAME" "$CHECKSUMS_NAME"; do
            [[ "$asset" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo "Unsafe release asset name: $asset" >&2
              exit 1
            }
            test -s "$RELEASE_DIR/$asset"
          done

          state_dir="$(mktemp -d "$RUNNER_TEMP/address-atlas-release-publish.XXXXXX")"
          draft_nonce="$(openssl rand -hex 16)"
          draft_marker="<!-- address-atlas-release-owner:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${draft_nonce} -->"
          draft_id=""
          published=false
          api_header=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2026-03-10'
          )

          find_owned_draft_id() {
            local lookup="$state_dir/owned-draft-lookup.json"
            gh api "${api_header[@]}" --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$lookup" 2>/dev/null \
              || return 1
            jq -er \
              --arg tag "$RELEASE_TAG" \
              --arg marker "$draft_marker" '
                [
                  .[][]?
                  | select(
                      .tag_name == $tag
                      and .draft == true
                      and (.body | type == "string" and startswith($marker))
                    )
                ]
                | if length == 1 then .[0].id else empty end
              ' "$lookup"
          }

          release_is_owned_draft() {
            local release_id="$1"
            local response="$state_dir/owned-draft-${release_id}.json"
            gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$response" 2>/dev/null \
              || return 1
            jq -e \
              --argjson id "$release_id" \
              --arg tag "$RELEASE_TAG" \
              --arg name "Address Atlas $APP_VERSION" \
              --arg marker "$draft_marker" '
                .id == $id
                and .tag_name == $tag
                and .name == $name
                and .draft == true
                and .prerelease == false
                and (.body | type == "string" and startswith($marker))
              ' "$response" >/dev/null
          }

          release_tag_is_exclusively_owned_draft() {
            local release_id="$1"
            local response="$state_dir/releases-final.json"
            gh api "${api_header[@]}" --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$response" 2>/dev/null || return 1
            jq -e \
              --argjson id "$release_id" \
              --arg tag "$RELEASE_TAG" \
              --arg name "Address Atlas $APP_VERSION" \
              --arg marker "$draft_marker" '
                [ .[][]? | select(.tag_name == $tag) ] as $matching
                | ($matching | length) == 1
                  and $matching[0].id == $id
                  and $matching[0].name == $name
                  and $matching[0].draft == true
                  and $matching[0].prerelease == false
                  and ($matching[0].body | type == "string" and startswith($marker))
              ' "$response" >/dev/null
          }

          release_governance_is_intact() {
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/environments/release" \
              > "$state_dir/environment-final.json" 2>/dev/null || return 1
            jq -e '
              .name == "release"
              and .deployment_branch_policy.protected_branches == false
              and .deployment_branch_policy.custom_branch_policies == true
              and any(
                .protection_rules[]?;
                .type == "required_reviewers"
                and .prevent_self_review == true
                and (.reviewers | type == "array" and length > 0)
              )
            ' "$state_dir/environment-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies?per_page=100" \
              > "$state_dir/environment-policies-final.json" 2>/dev/null || return 1
            jq -e '
              [.[].branch_policies[]?] as $policies
              | ($policies | length) == 1
                and $policies[0].type == "tag"
                and $policies[0].name == "v*"
            ' "$state_dir/environment-policies-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              > "$state_dir/immutability-final.json" 2>/dev/null || return 1
            jq -e '.enabled == true' "$state_dir/immutability-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/private-vulnerability-reporting" \
              > "$state_dir/private-vulnerability-reporting-final.json" 2>/dev/null || return 1
            jq -e '.enabled == true' \
              "$state_dir/private-vulnerability-reporting-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/actions/permissions" \
              > "$state_dir/actions-permissions-final.json" 2>/dev/null || return 1
            jq -e '
              .enabled == true
              and .allowed_actions == "selected"
              and .sha_pinning_required == true
            ' "$state_dir/actions-permissions-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/actions/permissions/selected-actions" \
              > "$state_dir/selected-actions-final.json" 2>/dev/null || return 1
            jq -e '
              .github_owned_allowed == true
              and .verified_allowed == false
              and (.patterns_allowed | type == "array" and length == 0)
            ' "$state_dir/selected-actions-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
              > "$state_dir/workflow-permissions-final.json" 2>/dev/null || return 1
            jq -e '
              .default_workflow_permissions == "read"
              and .can_approve_pull_request_reviews == false
            ' "$state_dir/workflow-permissions-final.json" >/dev/null || return 1
            GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&per_page=100" \
              > "$state_dir/ruleset-list-final.json" 2>/dev/null || return 1
            : > "$state_dir/rulesets-final.ndjson" || return 1
            while IFS= read -r ruleset_id; do
              [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]] || return 1
              GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api "${api_header[@]}" \
                "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" \
                >> "$state_dir/rulesets-final.ndjson" 2>/dev/null || return 1
              printf '\n' >> "$state_dir/rulesets-final.ndjson" || return 1
            done < <(jq -r '.[][]? | .id' "$state_dir/ruleset-list-final.json")
            jq -s '.' "$state_dir/rulesets-final.ndjson" \
              > "$state_dir/rulesets-final.json" || return 1
            jq -e '
              def explicit_ref($target; $include):
                .target == $target
                and .enforcement == "active"
                and (.conditions.ref_name.include | type == "array")
                and (.conditions.ref_name.exclude | type == "array" and length == 0)
                and (.conditions.ref_name.include | index($include)) != null;
              def has_rule($type):
                any(.rules[]?; .type == $type);
              def strong_main($required_checks):
                (explicit_ref("branch"; "~DEFAULT_BRANCH") or explicit_ref("branch"; "refs/heads/main"))
                and has_rule("deletion")
                and has_rule("non_fast_forward")
                and has_rule("required_linear_history")
                and any(
                  .rules[]?;
                  .type == "pull_request"
                  and .parameters.dismiss_stale_reviews_on_push == true
                  and .parameters.require_last_push_approval == true
                  and .parameters.required_review_thread_resolution == true
                  and .parameters.required_approving_review_count >= 1
                )
                and any(
                  .rules[]?;
                  .type == "required_status_checks"
                  and .parameters.strict_required_status_checks_policy == true
                  and .parameters.do_not_enforce_on_create != true
                  and (
                    [
                      .parameters.required_status_checks[]?
                      | select(.integration_id | type == "number" and . > 0)
                      | .context
                    ] as $configured
                    | all(
                        $required_checks[];
                        . as $required
                        | ($configured | index($required)) != null
                      )
                  )
                );
              def strong_release_tags:
                explicit_ref("tag"; "refs/tags/v*")
                and has_rule("creation")
                and has_rule("update")
                and has_rule("deletion");
              [
                "Repository secret-artifact hygiene",
                "Web and sync server",
                "Native macOS package",
                "Deployment configuration"
              ] as $required_checks
              | any(.[]; strong_main($required_checks))
                and any(.[]; strong_release_tags)
            ' "$state_dir/rulesets-final.json" >/dev/null
          }

          remote_assets_are_exact() {
            local release_id="$1"
            local response="$state_dir/remote-assets-final.json"
            local artifact_size manifest_size checksums_size
            local artifact_digest manifest_digest checksums_digest
            artifact_size="$(stat -f '%z' "$RELEASE_DIR/$ARTIFACT_NAME")"
            manifest_size="$(stat -f '%z' "$RELEASE_DIR/$MANIFEST_NAME")"
            checksums_size="$(stat -f '%z' "$RELEASE_DIR/$CHECKSUMS_NAME")"
            artifact_digest="sha256:$(shasum -a 256 "$RELEASE_DIR/$ARTIFACT_NAME" | awk '{ print $1 }')"
            manifest_digest="sha256:$(shasum -a 256 "$RELEASE_DIR/$MANIFEST_NAME" | awk '{ print $1 }')"
            checksums_digest="sha256:$(shasum -a 256 "$RELEASE_DIR/$CHECKSUMS_NAME" | awk '{ print $1 }')"
            gh api "${api_header[@]}" --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              > "$response" 2>/dev/null || return 1
            jq -e \
              --arg artifact "$ARTIFACT_NAME" \
              --arg manifest "$MANIFEST_NAME" \
              --arg checksums "$CHECKSUMS_NAME" \
              --arg artifact_digest "$artifact_digest" \
              --arg manifest_digest "$manifest_digest" \
              --arg checksums_digest "$checksums_digest" \
              --argjson artifact_size "$artifact_size" \
              --argjson manifest_size "$manifest_size" \
              --argjson checksums_size "$checksums_size" '
                [ .[][]? ] as $assets
                | ($assets | length) == 3
                  and all($assets[]; .state == "uploaded" and (.id | type == "number" and . > 0))
                  and any($assets[]; .name == $artifact and .content_type == "application/x-apple-diskimage" and .size == $artifact_size and .digest == $artifact_digest)
                  and any($assets[]; .name == $manifest and .content_type == "application/json" and .size == $manifest_size and .digest == $manifest_digest)
                  and any($assets[]; .name == $checksums and .content_type == "text/plain" and .size == $checksums_size and .digest == $checksums_digest)
              ' "$response" >/dev/null
          }

          cleanup_unpublished_draft() {
            local cleanup_id="${draft_id:-}"
            set +e
            if [[ "$published" != "true" ]]; then
              if [[ -z "$cleanup_id" ]]; then
                cleanup_id="$(find_owned_draft_id 2>/dev/null || true)"
              fi
              if [[ "$cleanup_id" =~ ^[1-9][0-9]*$ ]] \
                && release_is_owned_draft "$cleanup_id"; then
                if gh api "${api_header[@]}" --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/$cleanup_id" >/dev/null 2>&1; then
                  echo "::notice::Removed this run's unpublished release draft $cleanup_id."
                else
                  echo "::warning::Could not remove this run's unpublished release draft $cleanup_id; remove only the draft carrying marker $draft_marker."
                fi
              elif [[ -n "$cleanup_id" ]]; then
                echo "::warning::Refused to delete release $cleanup_id because it is not this run's owned draft."
              fi
            fi
            rm -rf "$state_dir"
          }
          trap cleanup_unpublished_draft EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          verify_production_config_binding() {
            local phase="$1"
            scripts/verify-live-native-config.sh \
              "$PRODUCTION_SYNC_ORIGIN" \
              "$APP_VERSION" \
              "$BUNDLED_CONFIG_VERSION" \
              "$SOURCE_COMMIT" \
              "${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${phase}" \
              "$EXPECTED_PRODUCTION_CONFIG_BINDING" >/dev/null
          }

          # Long-running signing/notarization creates a meaningful TOCTOU
          # window. Refuse to stage anything if production already moved away
          # from the exact policy and reviewed server revision approved above.
          verify_production_config_binding predraft

          # Recheck every authenticated release, including drafts, immediately
          # before creation. The POST remains the authoritative race-safe gate.
          gh api "${api_header[@]}" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$state_dir/releases-before-create.json"
          jq -e --arg tag "$RELEASE_TAG" \
            '[.[][]? | select(.tag_name == $tag)] | length == 0' \
            "$state_dir/releases-before-create.json" >/dev/null || {
            echo "A draft or published release already exists for $RELEASE_TAG; refusing to mutate it." >&2
            exit 1
          }

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg source "$SOURCE_COMMIT" \
            --arg name "Address Atlas $APP_VERSION" \
            --arg body "$draft_marker" '
              {
                tag_name: $tag,
                target_commitish: $source,
                name: $name,
                body: $body,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              }
            ' > "$state_dir/create-release.json"
          gh api "${api_header[@]}" --method POST \
            --input "$state_dir/create-release.json" \
            "repos/$GITHUB_REPOSITORY/releases" \
            > "$state_dir/draft-release.json"
          draft_id="$(jq -er '.id | select(type == "number" and . > 0)' "$state_dir/draft-release.json")"
          release_is_owned_draft "$draft_id" || {
            echo "GitHub did not return the uniquely owned draft this run created." >&2
            exit 1
          }

          # Keep the bearer token out of curl's process arguments while sending
          # raw asset bytes to the release-specific uploads host.
          printf '%s\n' \
            'silent' \
            'show-error' \
            'connect-timeout = 15' \
            'max-time = 600' \
            'header = "Accept: application/vnd.github+json"' \
            'header = "X-GitHub-Api-Version: 2026-03-10"' \
            "header = \"Authorization: Bearer $GH_TOKEN\"" \
            > "$state_dir/curl.conf"
          chmod 0600 "$state_dir/curl.conf"

          upload_asset() {
            local name="$1"
            local content_type="$2"
            local path="$RELEASE_DIR/$name"
            local response="$state_dir/upload-${name}.json"
            local expected_size expected_digest http_status
            expected_size="$(stat -f '%z' "$path")"
            expected_digest="sha256:$(shasum -a 256 "$path" | awk '{ print $1 }')"
            http_status="$(curl --config "$state_dir/curl.conf" \
              --request POST \
              --header "Content-Type: $content_type" \
              --data-binary "@$path" \
              --output "$response" \
              --write-out '%{http_code}' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$draft_id/assets?name=$name")"
            if [[ "$http_status" != "201" ]]; then
              echo "GitHub rejected draft asset $name (HTTP $http_status)." >&2
              head -c 4096 "$response" >&2 || true
              printf '\n' >&2
              return 1
            fi
            jq -e \
              --arg name "$name" \
              --arg content_type "$content_type" \
              --arg digest "$expected_digest" \
              --argjson size "$expected_size" '
                .name == $name
                and .content_type == $content_type
                and .state == "uploaded"
                and .size == $size
                and .digest == $digest
                and (.id | type == "number" and . > 0)
              ' "$response" >/dev/null
          }

          upload_asset "$ARTIFACT_NAME" application/x-apple-diskimage
          upload_asset "$MANIFEST_NAME" application/json
          upload_asset "$CHECKSUMS_NAME" text/plain

          gh api "${api_header[@]}" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id/assets?per_page=100" \
            > "$state_dir/remote-assets.json"
          test "$(jq '[.[][]?] | length' "$state_dir/remote-assets.json")" = "3"

          remote_dir="$state_dir/downloaded-assets"
          mkdir -m 0700 "$remote_dir"
          for asset in "$ARTIFACT_NAME" "$MANIFEST_NAME" "$CHECKSUMS_NAME"; do
            local_path="$RELEASE_DIR/$asset"
            expected_size="$(stat -f '%z' "$local_path")"
            expected_sha256="$(shasum -a 256 "$local_path" | awk '{ print $1 }')"
            asset_id="$(jq -er \
              --arg name "$asset" \
              --arg digest "sha256:$expected_sha256" \
              --argjson size "$expected_size" '
                [.[][]? | select(
                  .name == $name
                  and .state == "uploaded"
                  and .size == $size
                  and .digest == $digest
                )]
                | if length == 1 then .[0].id else empty end
              ' "$state_dir/remote-assets.json")"
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            remote_path="$remote_dir/$asset"
            gh api "${api_header[@]}" \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$remote_path"
            test "$(stat -f '%z' "$remote_path")" = "$expected_size"
            test "$(shasum -a 256 "$remote_path" | awk '{ print $1 }')" = "$expected_sha256"
            cmp -s "$local_path" "$remote_path"
          done

          # No published object exists before this point. Re-prove ownership and
          # perform one final PATCH; changing draft=false is the sole publish act.
          release_tag_is_exclusively_owned_draft "$draft_id" || {
            echo "The staged release is no longer the sole owned draft for this tag; refusing publication. Cleanup remains restricted to this run's unchanged draft." >&2
            exit 1
          }
          remote_assets_are_exact "$draft_id" || {
            echo "The staged asset set changed after byte-for-byte verification; refusing publication." >&2
            exit 1
          }
          release_governance_is_intact || {
            echo "Protected environment, immutable release, security-reporting, Actions, or ruleset governance changed during the build; refusing publication." >&2
            exit 1
          }
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main; then
            echo "The release commit is no longer contained in origin/main; refusing publication." >&2
            exit 1
          fi
          remote_tag_records="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/${RELEASE_TAG}^{}")"
          remote_object_count="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref { count += 1 } END { print count + 0 }' <<< "$remote_tag_records")"
          remote_peeled_count="$(awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { count += 1 } END { print count + 0 }' <<< "$remote_tag_records")"
          if [[ "$remote_object_count" != "1" ]] || (( remote_peeled_count > 1 )); then
            echo "The remote release tag became missing or ambiguous before publication." >&2
            exit 1
          fi
          remote_tag_object="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref { print $1 }' <<< "$remote_tag_records")"
          remote_tag_commit="$(awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1 }' <<< "$remote_tag_records")"
          if [[ -z "$remote_tag_commit" ]]; then
            remote_tag_commit="$remote_tag_object"
          fi
          local_tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          if [[ "$remote_tag_object" != "$local_tag_object" ||
                "$remote_tag_commit" != "$SOURCE_COMMIT" ]]; then
            echo "The remote release tag moved after the build; refusing publication." >&2
            exit 1
          fi
          verify_production_config_binding prepublish
          jq -n '{ draft: false, prerelease: false, make_latest: "legacy" }' \
            > "$state_dir/publish-release.json"
          if ! gh api "${api_header[@]}" --method PATCH \
              --input "$state_dir/publish-release.json" \
              "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
              > "$state_dir/published-release.json"; then
            # A transport failure can be ambiguous: GitHub may have accepted the
            # irreversible publish. Resolve by ID and never issue a second PATCH.
            echo "::warning::The publish response was ambiguous; resolving the existing release by ID."
            publish_resolved=false
            for attempt in {1..6}; do
              if gh api "${api_header[@]}" \
                  "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
                  > "$state_dir/published-release.json" 2>/dev/null \
                && jq -e '.draft == false and (.published_at | type == "string" and length > 0)' \
                  "$state_dir/published-release.json" >/dev/null; then
                publish_resolved=true
                break
              fi
              sleep 5
            done
            if [[ "$publish_resolved" != "true" ]]; then
              echo "GitHub did not prove whether the one permitted publish operation succeeded; refusing to retry it." >&2
              exit 1
            fi
          fi
          jq -e \
            --argjson id "$draft_id" \
            --arg tag "$RELEASE_TAG" \
            --arg name "Address Atlas $APP_VERSION" \
            '
              .id == $id
              and .tag_name == $tag
              and .name == $name
              and .draft == false
              and .prerelease == false
              and (.published_at | type == "string" and length > 0)
            ' "$state_dir/published-release.json" >/dev/null || {
            echo "GitHub did not confirm the final publication state." >&2
            exit 1
          }
          published=true
          published_url="$(jq -er '.html_url' "$state_dir/published-release.json")"
          echo "release_id=$draft_id" >> "$GITHUB_OUTPUT"
          echo "release_url=$published_url" >> "$GITHUB_OUTPUT"
          trap - EXIT INT TERM
          rm -rf "$state_dir"

      - name: Verify immutable release and asset attestations
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.artifacts.outputs.release_dir }}
          ARTIFACT_NAME: ${{ steps.artifacts.outputs.artifact_name }}
          MANIFEST_NAME: ${{ steps.artifacts.outputs.manifest_name }}
          CHECKSUMS_NAME: ${{ steps.artifacts.outputs.checksums_name }}
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          api_header=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2026-03-10'
          )
          verification_dir="$(mktemp -d "$RUNNER_TEMP/address-atlas-release-verification.XXXXXX")"
          trap 'rm -rf "$verification_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          artifact_digest="sha256:$(shasum -a 256 "$RELEASE_DIR/$ARTIFACT_NAME" | awk '{ print $1 }')"
          manifest_digest="sha256:$(shasum -a 256 "$RELEASE_DIR/$MANIFEST_NAME" | awk '{ print $1 }')"
          checksums_digest="sha256:$(shasum -a 256 "$RELEASE_DIR/$CHECKSUMS_NAME" | awk '{ print $1 }')"
          artifact_size="$(stat -f '%z' "$RELEASE_DIR/$ARTIFACT_NAME")"
          manifest_size="$(stat -f '%z' "$RELEASE_DIR/$MANIFEST_NAME")"
          checksums_size="$(stat -f '%z' "$RELEASE_DIR/$CHECKSUMS_NAME")"

          release_tag_is_exact() {
            local tag_ref="refs/tags/$RELEASE_TAG"
            local records object_count peeled_count remote_object remote_commit local_object
            records="$(git ls-remote origin "$tag_ref" "${tag_ref}^{}")" || return 1
            object_count="$(awk -v ref="$tag_ref" '$2 == ref { count += 1 } END { print count + 0 }' <<< "$records")"
            peeled_count="$(awk -v ref="${tag_ref}^{}" '$2 == ref { count += 1 } END { print count + 0 }' <<< "$records")"
            [[ "$object_count" == "1" ]] && (( peeled_count <= 1 )) || return 1
            remote_object="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<< "$records")"
            remote_commit="$(awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }' <<< "$records")"
            [[ -n "$remote_commit" ]] || remote_commit="$remote_object"
            local_object="$(git rev-parse "$tag_ref")" || return 1
            [[ "$remote_object" == "$local_object" && "$remote_commit" == "$SOURCE_COMMIT" ]]
          }

          release_metadata_is_exact() {
            local response="$verification_dir/release.json"
            gh api "${api_header[@]}" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$response" 2>/dev/null \
              || return 1
            jq -e \
              --argjson id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" \
              --arg name "Address Atlas $APP_VERSION" \
              --arg artifact "$ARTIFACT_NAME" \
              --arg manifest "$MANIFEST_NAME" \
              --arg checksums "$CHECKSUMS_NAME" \
              --arg artifact_digest "$artifact_digest" \
              --arg manifest_digest "$manifest_digest" \
              --arg checksums_digest "$checksums_digest" \
              --argjson artifact_size "$artifact_size" \
              --argjson manifest_size "$manifest_size" \
              --argjson checksums_size "$checksums_size" '
                .id == $id
                and .tag_name == $tag
                and .name == $name
                and .draft == false
                and .prerelease == false
                and .immutable == true
                and (.published_at | type == "string" and length > 0)
                and (.assets | length) == 3
                and any(.assets[]; .name == $artifact and .size == $artifact_size and .digest == $artifact_digest)
                and any(.assets[]; .name == $manifest and .size == $manifest_size and .digest == $manifest_digest)
                and any(.assets[]; .name == $checksums and .size == $checksums_size and .digest == $checksums_digest)
              ' "$response" >/dev/null
          }

          verified=false
          for attempt in {1..60}; do
            if release_tag_is_exact \
              && release_metadata_is_exact \
              && gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$RELEASE_TAG" "$RELEASE_DIR/$ARTIFACT_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$RELEASE_TAG" "$RELEASE_DIR/$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$RELEASE_TAG" "$RELEASE_DIR/$CHECKSUMS_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "The release is already published and must not be recreated, but GitHub did not confirm immutability and every asset attestation within five minutes." >&2
            exit 1
          fi

          printf 'Published and verified immutable release [%s](%s) from commit `%s`.\n' \
            "$RELEASE_TAG" "$RELEASE_URL" "$SOURCE_COMMIT" \
            >> "$GITHUB_STEP_SUMMARY"
