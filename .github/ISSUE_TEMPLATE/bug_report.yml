name: Bug report
description: Report a reproducible, non-sensitive problem in Address Atlas
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Address Atlas.

        **Do not include wallet inventories, exact balances, exchange credentials, bearer tokens, passkeys, recovery material, private keys, `.env` contents, production logs, or unredacted exports.** Report security issues through [private vulnerability reporting](https://github.com/girginomer10/address-atlas/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Build or commit
      description: Provide the app version and build number, the Git commit, or the branch you tested.
      placeholder: 0.2.0 (175), 394e8e7, or main at YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For app bugs, include the macOS or iOS version and the device, such as a Mac with Apple silicon, an iPhone, or an iPad. For build, CI, or legacy sync service bugs, include the OS and relevant Xcode, Node, npm, Docker, or PostgreSQL versions.
      placeholder: macOS 15.5 on Apple silicon, iOS 26.5 on iPhone 17 Pro, or Ubuntu 24.04 with Node 22.23 and Docker 28
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Affected surface
      description: Name the screen, portfolio view, theme, network, exchange, export, iCloud action, or build step.
      placeholder: Wallet scan — Solana
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted data and list the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Add synthetic ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact non-sensitive error or visible warning when useful.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional. Remove addresses, balances, credentials, tokens, request headers, URLs with secrets, and personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed real portfolio data, credentials, recovery material, and other secrets.
          required: true
        - label: This is not a vulnerability or suspected data exposure.
          required: true
