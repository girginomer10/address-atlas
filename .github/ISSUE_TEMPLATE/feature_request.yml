name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Address Atlas is read-only and zero-custody. Proposals that require seed phrases, wallet private keys, signing, trading, transfer, or withdrawal permissions are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior and result, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and trust-boundary impact
      description: Explain new data, permissions, providers, persistence, export, or sync behavior. Write "None" only when genuinely unaffected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Scope checklist
      options:
        - label: I searched existing issues and documentation first.
          required: true
        - label: The proposal preserves read-only, zero-custody behavior.
          required: true
        - label: I did not include real portfolio data or secrets.
          required: true
