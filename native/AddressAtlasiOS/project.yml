# xcodegen specification for the Address Atlas iOS app.
# Regenerate the committed AddressAtlasiOS.xcodeproj with ./generate-project.sh
# after editing this file. The Mac app stays a plain SwiftPM package; the iOS
# app compiles the shared state layer and design system from that package's
# sources and links the AddressAtlasCore library product.
name: AddressAtlasiOS
options:
  bundleIdPrefix: com.addressatlas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  AddressAtlasMac:
    path: ../AddressAtlasMac
settings:
  base:
    DEVELOPMENT_TEAM: VWW3GZL279
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  AddressAtlasiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    supportedDestinations: [iOS, iPadOS]
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: Sources/AddressAtlasiOS
      - path: ../AddressAtlasMac/Sources/AddressAtlasMac
        name: SharedMacSources
        excludes:
          - AddressAtlasApp.swift
          - AppShellViews.swift
          - PortfolioViews.swift
          - PortfolioComponents.swift
          - ExchangeSyncViews.swift
          - ICloudSyncView.swift
          - PrivacySafeDiagnosticsView.swift
      - path: Resources/Assets.xcassets
      - path: ../AddressAtlasMac/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AddressAtlasMac
        product: AddressAtlasCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Address Atlas
        CFBundleName: Address Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Ömer Girgin. All rights reserved."
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Consumed by the shared AppState update routing. There is no iOS App
        # Store record yet, so the generic storefront is the fail-closed route.
        AddressAtlasDistributionChannel: app-store
        AddressAtlasUpdateURL: https://apps.apple.com
        AddressAtlasSourceCommit: $(ADDRESS_ATLAS_SOURCE_COMMIT)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.addressatlas.recovery-kit
            UTTypeDescription: Address Atlas Recovery Kit
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - atlas-recovery
              public.mime-type:
                - application/json
    entitlements:
      path: Resources/AddressAtlasiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.addressatlas.mac
        com.apple.developer.icloud-services:
          - CloudKit
        # The Mac app stores the synchronizable iCloud copy key in its default
        # keychain group (<team>.com.addressatlas.mac). Listing that group
        # first makes it this app's default group too, so the key written on a
        # Mac is visible on iOS through iCloud Keychain.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.addressatlas.mac
          - $(AppIdentifierPrefix)com.addressatlas.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addressatlas.ios
        PRODUCT_NAME: Address Atlas
        PRODUCT_MODULE_NAME: AddressAtlasiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
