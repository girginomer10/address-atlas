<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Address Atlas</title>
  <desc id="description">A read-only crypto portfolio for Mac and iPhone. Your data stays on your devices.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11120f"/>
      <stop offset="0.58" stop-color="#171914"/>
      <stop offset="1" stop-color="#0d1720"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3f6e96" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3f6e96" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="830" y="128" width="352" height="352" rx="82"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1010" cy="310" r="330" fill="url(#blueGlow)"/>

  <g opacity="0.19" stroke="#8ea9ba" fill="none">
    <circle cx="1010" cy="310" r="254" stroke-width="1.5"/>
    <circle cx="1010" cy="310" r="196" stroke-width="1" stroke-dasharray="7 10"/>
    <path d="M756 310h508M1010 56v508" stroke-width="1" stroke-dasharray="5 12"/>
    <path d="M824 136c117 102 255 102 372 0M824 484c117-102 255-102 372 0" stroke-width="1"/>
  </g>

  <g transform="translate(72 50)">
    <text x="0" y="136" fill="#f3eddf" font-family="Georgia, Times New Roman, serif" font-size="83" font-style="italic" font-weight="500" letter-spacing="-3">Address Atlas</text>

    <text x="0" y="214" fill="#e8e2d5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="450">
      <tspan x="0" dy="0">A read-only crypto portfolio</tspan>
      <tspan x="0" dy="42">for Mac and iPhone.</tspan>
    </text>

    <text x="0" y="318" fill="#aaa99f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">
      Your data stays on your devices.
    </text>

    <line x1="0" y1="372" x2="560" y2="372" stroke="#f3eddf" stroke-opacity="0.18"/>

    <g transform="translate(0 412)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="0" fill="#f3eddf" font-size="22" font-weight="700">20</text>
      <text x="0" y="24" fill="#8f9189" font-size="10" letter-spacing="1.6">NETWORKS</text>

      <text x="150" y="0" fill="#f3eddf" font-size="22" font-weight="700">3</text>
      <text x="150" y="24" fill="#8f9189" font-size="10" letter-spacing="1.6">EXCHANGES</text>

      <text x="300" y="0" fill="#f3eddf" font-size="22" font-weight="700">6</text>
      <text x="300" y="24" fill="#8f9189" font-size="10" letter-spacing="1.6">THEMES</text>

      <text x="450" y="0" fill="#f3eddf" font-size="22" font-weight="700">14</text>
      <text x="450" y="24" fill="#8f9189" font-size="10" letter-spacing="1.6">VIEWS</text>
    </g>
  </g>

  <rect x="806" y="104" width="400" height="400" rx="102" fill="#f2ecdd" fill-opacity="0.06" stroke="#f2ecdd" stroke-opacity="0.16" filter="url(#shadow)"/>
  <image href="../../native/AddressAtlasMac/Resources/AppIcon.png" x="830" y="128" width="352" height="352" preserveAspectRatio="xMidYMid meet" clip-path="url(#iconClip)"/>
</svg>
